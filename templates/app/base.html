<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BibleVideo App</title>
    <link rel="stylesheet" href="/static/app.css">
</head>

<body class="{% block body_class%}{% endblock %}">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-circle"></div>
                <h2>BibleVideo</h2>
            </div>
            
            <a href="/jobs/new" class="btn-quick-create">
                <span>+</span> Novo Vídeo
            </a>

            <nav class="main-nav">
                <a href="/" class="nav-item {{ 'active' if request.url.path == '/' else '' }}">Início</a>
                <a href="/readings" class="nav-item {{ 'active' if request.url.path == '/readings' else '' }}">Leituras</a>
                <a href="/template/new" class="nav-item {{ 'active' if request.url.path == '/template/new' else '' }}">Templates</a>
            </nav>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
