<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name() }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
</head>

<body class="{% block body_class%}{% endblock %}">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-circle"></div>
                <h2>{{ app_name() }}</h2>
            </div>
            
            <a href="/videos/new" class="btn-quick-create">
                <span>+</span> Novo Vídeo
            </a>

            <nav class="main-nav">
                <a href="/" class="nav-item {{ 'active' if request.url.path == '/' else '' }}">Início</a>
                <a href="/videos" class="nav-item {{ 'active' if request.url.path == '/videos' else '' }}">Vídeos</a>
                <a href="/soundtracks" class="nav-item {{ 'active' if request.url.path == '/soundtracks' else '' }}">Trilhas</a>
            </nav>

            <footer class="sidebar-footer">
                <a href="/settings" class="nav-item {{ 'active' if request.url.path == '/settings' else '' }}">Configurações</a>
            </footer>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>window.STATUS_LABELS = {{ status_labels()|tojson }};</script>
    <script src="/static/toast.js"></script>
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
