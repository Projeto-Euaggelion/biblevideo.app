<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Templates - BibleVideo</title>
    <link rel="stylesheet" href="/static/app.css">
    
    <style>
        /* Base / Layout Fullscreen blindado contra o app.css */
        body, html {
            margin: 0 !important; 
            padding: 0 !important; 
            height: 100vh !important; 
            width: 100vw !important;
            display: flex !important;
            background-color: #0d0d0d; 
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff; 
            overflow: hidden !important;
        }

        /* Sidebar Esquerda (Controlador) */
        .editor-sidebar {
            width: 420px !important;
            min-width: 420px !important;
            background-color: #121212;
            border-right: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid #27272a;
        }

        .nav-top {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;
        }

        .nav-top h2 { margin: 0; font-size: 1.1rem; font-weight: 600; }

        .btn {
            background-color: #e4e4e7; color: #18181b; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none;
            font-size: 0.85rem; transition: all 0.2s;
        }
        .btn:hover { background-color: #fff; }
        
        .btn-outline { background: transparent; color: #a1a1aa; border: 1px solid #3f3f46; }
        .btn-outline:hover { background: #27272a; color: #fff; }

        .header-actions { display: flex; gap: 10px; }
        .header-actions select {
            flex: 1; background-color: #000; color: white; border: 1px solid #3f3f46;
            border-radius: 6px; padding: 8px; outline: none;
        }

        .sidebar-content {
            flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
        }

        .editor-block h3 {
            margin: 0 0 0.5rem 0; font-size: 0.75rem; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.1em;
        }

        .editor-textarea {
            width: 100%; height: 250px; background-color: #000; color: #e4e4e7;
            border: 1px solid #3f3f46; border-radius: 8px; padding: 1rem;
            font-family: 'Fira Code', Consolas, Monaco, monospace; font-size: 0.85rem;
            line-height: 1.5; resize: vertical; outline: none; box-sizing: border-box;
        }
        .editor-textarea:focus { border-color: #a1a1aa; }

        .test-controls-card {
            background-color: #18181b; border: 1px solid #27272a; border-radius: 8px;
            padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem;
        }

        .test-controls-card label {
            font-size: 0.8rem; color: #a1a1aa; display: flex; flex-direction: column; gap: 0.5rem;
        }

        .test-controls-card input[type="number"], .test-controls-card select, .test-controls-card input[type="range"] {
            background-color: #000; color: white; border: 1px solid #3f3f46;
            border-radius: 6px; padding: 8px; box-sizing: border-box; outline: none;
        }

        /* Área de Preview Principal - Totalmente forçada a preencher o resto */
        .preview-workspace {
            flex-grow: 1 !important; /* Força preenchimento horizontal */
            min-width: 0 !important; /* Previne que elementos filhos quebrem o flexbox */
            height: 100vh !important;
            display: flex !important;
            align-items: center !important; 
            justify-content: center !important; 
            background-color: #09090b !important;
            background-image: 
                linear-gradient(45deg, #18181b 25%, transparent 25%, transparent 75%, #18181b 75%, #18181b),
                linear-gradient(45deg, #18181b 25%, transparent 25%, transparent 75%, #18181b 75%, #18181b) !important;
            background-size: 30px 30px !important;
            background-position: 0 0, 15px 15px !important;
            overflow: hidden !important;
        }

        /* Container do celular, manipulado rigorosamente via JS */
        .phone-wrapper {
            position: relative;
            background: #000;
            border: 12px solid #000;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            box-sizing: content-box; /* Garante que a borda não esmague o iframe */
        }

        .phone-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            border: none;
            transform-origin: top left;
            background-color: #000;
        }

        /* Scrollbar */
        .sidebar-content::-webkit-scrollbar { width: 6px; }
        .sidebar-content::-webkit-scrollbar-track { background: #121212; }
        .sidebar-content::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body>

    <aside class="editor-sidebar">
        <div class="sidebar-header">
            <div class="nav-top">
                <h2>Editor Visual</h2>
                <a href="/" class="btn btn-outline">← Voltar</a>
            </div>
            <div class="header-actions">
                <select id="template-select" onchange="loadSelectedTemplate()">
                    <option value="">-- Criar Novo Template --</option>
                    {% for t in templates_list %}
                        <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
                <button id="btn-save-template" class="btn" onclick="saveTemplate()">
                    Salvar
                </button>
            </div>
        </div>

        <div class="sidebar-content">
            <div class="editor-block">
                <h3>HTML / Jinja2 (template.html)</h3>
                <textarea id="html-editor" class="editor-textarea" spellcheck="false" placeholder="Código HTML..."></textarea>
            </div>

            <div class="editor-block">
                <h3>CSS (style.css)</h3>
                <textarea id="css-editor" class="editor-textarea" spellcheck="false" placeholder="Código CSS..."></textarea>
            </div>

            <div class="test-controls-card">
                <h3 style="margin:0; font-size: 0.85rem; color: #e4e4e7;">Simulador Playwright</h3>
                
                <label>
                    Versículo em Destaque (0 a 5)
                    <input type="number" id="test-verse-index" value="0" min="0" max="5" onchange="triggerTestAnimation()">
                </label>

                <label>
                    Progresso da Transição (0.0 a 1.0)
                    <input type="range" id="test-progress" min="0" max="1" step="0.02" value="1.0" oninput="triggerTestAnimation()">
                </label>

                <label>
                    Formato do Vídeo
                    <select id="video-format-select" onchange="updateScaleAndPreview()">
                        <option value="vertical">Vertical (9:16)</option>
                        <option value="landscape">Paisagem (16:9)</option>
                    </select>
                </label>
            </div>
        </div>
    </aside>

    <!-- Usando DIV em vez de MAIN para evitar regras do app.css -->
    <div class="preview-workspace" id="workspace">
        <div class="phone-wrapper" id="simulator">
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        const htmlEditor = document.getElementById('html-editor');
        const cssEditor = document.getElementById('css-editor');
        const iframe = document.getElementById('preview-frame');
        const simulator = document.getElementById('simulator');
        const workspace = document.getElementById('workspace');
        const templateSelect = document.getElementById('template-select');
        const verseIndexInput = document.getElementById('test-verse-index');
        const progressInput = document.getElementById('test-progress');
        const videoFormatSelect = document.getElementById('video-format-select');

        // Matemática blindada para calcular e centralizar a tela de preview
        function applyScale() {
            const format = videoFormatSelect.value;
            
            // Subtrai uma margem de segurança do espaço disponível
            const availWidth = workspace.clientWidth - 100;
            const availHeight = workspace.clientHeight - 100;

            let baseW, baseH, bRadius;
            
            if (format === 'landscape') {
                baseW = 1920; baseH = 1080; bRadius = '12px';
            } else {
                baseW = 1080; baseH = 1920; bRadius = '36px';
            }

            // Descobre qual é a proporção ideal para encaixar na tela
            const scale = Math.min(availWidth / baseW, availHeight / baseH);

            // Aplica as medidas absolutas ao container
            simulator.style.width = `${baseW * scale}px`;
            simulator.style.height = `${baseH * scale}px`;
            simulator.style.borderRadius = bRadius;

            // Escala o iframe internamente
            iframe.style.width = `${baseW}px`;
            iframe.style.height = `${baseH}px`;
            iframe.style.transform = `scale(${scale})`;
        }

        // Observa a janela para redimensionar se o usuário alterar o tamanho do navegador
        window.addEventListener('resize', applyScale);

        let debounceTimer;
        function schedulePreview() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePreview, 300);
        }

        htmlEditor.addEventListener('input', schedulePreview);
        cssEditor.addEventListener('input', schedulePreview);

        function updateScaleAndPreview() {
            applyScale();
            updatePreview();
        }

        async function loadSelectedTemplate() {
            const name = templateSelect.value;
            if (!name) {
                htmlEditor.value = `<div class="lyrics-container">\n  {% for verse in verses %}\n    <div class="lyric-line" id="line-{{ loop.index0 }}">\n      <span class="vnum">{{ verse.verse }}</span> {{ verse.text }}\n    </div>\n  {% endfor %}\n</div>`;
                cssEditor.value = `body {\n  background-color: #0d0d0d;\n  color: #ffffff;\n  font-family: sans-serif;\n  margin: 0;\n  padding: 0;\n  width: 100vw;\n  height: 100vh;\n}\n\n.lyrics-container {\n  padding: 20px;\n}\n\n.lyric-line {\n  font-size: 60px;\n  margin-bottom: 30px;\n}`;
                updateScaleAndPreview();
                return;
            }

            try {
                const res = await fetch(`/api/template/${name}`);
                if (!res.ok) throw new Error("Erro ao carregar arquivos.");
                const data = await res.json();
                
                htmlEditor.value = data.html;
                cssEditor.value = data.css;
                updateScaleAndPreview();
            } catch (e) {
                alert(e.message);
            }
        }

        async function updatePreview() {
            const format = videoFormatSelect.value;
            
            try {
                const response = await fetch('/api/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        html: htmlEditor.value,
                        css: cssEditor.value,
                        video_format: format
                    })
                });

                const renderedHtml = await response.text();

                const doc = iframe.contentWindow.document;
                doc.open();
                doc.write(renderedHtml);
                doc.close();

                iframe.onload = () => triggerTestAnimation();
            } catch (err) {
                console.error("Erro no preview:", err);
            }
        }

        function triggerTestAnimation() {
            const index = parseInt(verseIndexInput.value, 10);
            const progress = parseFloat(progressInput.value);

            if (iframe.contentWindow && typeof iframe.contentWindow.updateFrame === 'function') {
                iframe.contentWindow.updateFrame(index, progress);
            }
        }

        async function saveTemplate() {
            let templateName = templateSelect.value;
            if (!templateName) {
                templateName = prompt("Digite o nome do novo template (sem espaços):");
                if (!templateName) return;
            }

            const btn = document.getElementById('btn-save-template');
            btn.textContent = "Salvando...";
            
            try {
                const res = await fetch('/template/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: templateName,
                        html_content: htmlEditor.value,
                        css_content: cssEditor.value
                    })
                });

                if (res.ok) {
                    btn.textContent = "✓ Salvo!";
                    setTimeout(() => window.location.reload(), 1000);
                } else {
                    alert("Erro ao salvar template.");
                    btn.textContent = "💾 Salvar";
                }
            } catch (e) {
                alert("Falha de conexão ao salvar.");
                btn.textContent = "💾 Salvar";
            }
        }

        // Inicialização
        if (templateSelect.options.length > 1) {
            templateSelect.selectedIndex = 1;
            loadSelectedTemplate();
        } else {
            loadSelectedTemplate();
        }
        
        // Garante que a escala aplique logo ao abrir
        applyScale();
    </script>
</body>
</html>
