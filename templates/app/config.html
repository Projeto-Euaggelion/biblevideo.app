{% extends "app/base.html" %}
{% block title %}Configurações — Bible Video Generator{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1>Configurações</h1>
    <p class="muted">Gerencie as configurações do seu aplicativo.</p>
  </div>
</div>

<div class="page-content">
    <section class="card">
        <h2>Serviços</h2>
        <div class="settings-list">
            <a href="/settings/youtube" class="settings-item">
                <div>
                    <h3>YouTube</h3>
                    <p class="muted">Configure sua conta do YouTube e opções padrão de upload</p>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>
    </section>
</div>

<style>
.settings-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.settings-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 4px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s ease;
}

.settings-item:hover {
  background: #333;
  border-color: #4a9eff;
}

.settings-item h3 {
  margin: 0;
  margin-bottom: 4px;
  color: #fff;
  font-size: 16px;
}

.settings-item .muted {
  margin: 0;
  font-size: 13px;
}

.settings-item .arrow {
  font-size: 20px;
  color: #4a9eff;
}
</style>
{% endblock %}
