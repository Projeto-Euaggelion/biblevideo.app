{% extends "app/base.html" %}
{% block title %}Configurações — Bible Video Generator{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1>Configurações</h1>
    <p class="muted">Gerencie as configurações do seu aplicativo.</p>
  </div>
</div>

<section class="card card-table">
  <table class="data-table">
    <thead>
      <tr>
        <th>Serviço</th>
        <th>Descrição</th>
        <th class="col-actions"></th>
      </tr>
    </thead>
    <tbody>
      <tr class="data-row" onclick="window.location.href='/settings/youtube'">
        <td class="col-title">YouTube</td>
        <td class="muted">Configure sua conta do YouTube e opções padrão de upload</td>
        <td class="col-actions">
          <a href="/settings/youtube" class="link-arrow" onclick="event.stopPropagation()">Abrir →</a>
        </td>
      </tr>
    </tbody>
  </table>
</section>

{% endblock %}
