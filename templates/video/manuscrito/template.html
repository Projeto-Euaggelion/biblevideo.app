<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>{{ css_content | safe }}</style>
</head>
<body class="format-{{ video_format }}">
  <div class="stage">
    <div class="rule-top"></div>
    <h1 class="chapter-title">{{ chapter_title }}</h1>
    <div class="scroller">
      <div class="verses">
        {% for v in verses %}
        <span class="verse {% if current_verse is not none and v.verse == current_verse %}active{% endif %}">
          <sup class="vnum">{{ v.verse }}</sup>{{ v.text }}
        </span>
        {% endfor %}
      </div>
    </div>
  </div>
</body>
</html>
